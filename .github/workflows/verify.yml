name: verify

# Pull-request verification for FACT.
#
# This workflow CANNOT deploy. It has no secrets, no clasp, and read-only
# token permissions. Deployment lives entirely in deploy.yml, which runs on
# push to sandbox/main. Keeping the two separate means a verification change
# can never alter deployment behavior.
#
# The job is named "verify" deliberately: that string is the status-check
# context promoted to REQUIRED on main in Phase 2 (issue #14). Renaming the
# job silently breaks that branch-protection rule.
#
# The runner is pinned to ubuntu-24.04 to match deploy.yml. If verify and
# deploy ran on different OS images, a green verify would stop predicting a
# green deploy. (issue #34)

on:
  pull_request:
    branches:
      - main
      - sandbox

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Syntax, secret, and manifest checks
        run: sh scripts/check.sh
