name: Deploy to Google Apps Script

# HARDENED DEPLOYMENT WORKFLOW — Increment 2
#
# Changes from the previous version, and why:
#   1. environment:          gates each deploy behind a GitHub Environment.
#                            pmsc-production and fca-production have required
#                            reviewers, so a merge to main now PAUSES and waits
#                            for a human to approve. This closes the "reviewed
#                            before deploy, but not approved to deploy" gap.
#   2. per-env secrets:      script and deployment IDs come from environment
#                            secrets, not workflow source.
#   3. separate jobs:        PMSC and FCA are distinct jobs. FCA depends on
#                            PMSC succeeding, so a PMSC failure leaves BOTH
#                            environments on the previous version (fail
#                            closed) rather than deploying only one.
#   4. secret handling:      CLASPRC_JSON is passed via env: and written with
#                            printf under umask 077, so it never appears on a
#                            shell command line. Removed in an always() step.
#   5. .clasp.json patching: jq patches ONLY scriptId, preserving
#                            scriptExtensions / htmlExtensions /
#                            jsonExtensions / filePushOrder. The old version
#                            overwrote the whole file, so CI pushed under
#                            different rules than a local push. (issue #12)
#   6. clasp pinned:         3.4.1. Determined from evidence, not guessed:
#                            no @google/clasp release since 2026-08-28, so
#                            every green run from 2026-09-18 onward — including
#                            production runs #37 and #39 — used 3.4.1.
#                            (issue #11)
#   7. actions pinned:       SHA-pinned instead of floating tags. checkout
#                            v5.1.0 and setup-node v5.0.0 — the first release
#                            of each with a node24 action runtime. v4 ran on
#                            node20, which GitHub deprecated on runners.
#                            Deliberately NOT v6/v7: checkout v6.0.0 changed
#                            credential persistence, and this workflow writes
#                            .clasprc.json by hand. (issue #27)
#   8. permissions:          contents: read only.
#   9. concurrency:          one deploy per environment at a time; never
#                            cancels an in-flight production deploy.
#  10. dev removed:          dev no longer deploys to Sandbox. (issue #13)
#  11. fail-closed guards:   a missing secret aborts loudly rather than
#                            deploying to an unintended target.
#  12. runner pinned:        ubuntu-24.04, not ubuntu-latest. The latest
#                            label migrates to Ubuntu 26.04 between
#                            2026-10-19 and 2026-11-19, which would change
#                            the OS under a production deploy path with no
#                            commit to point at. Bump deliberately, in a
#                            reviewed diff, after Sandbox proves it.
#                            (issue #34)
#
# NOTE ON ATOMICITY: Apps Script offers no atomic multi-project deploy. If
# PMSC succeeds and FCA then fails, the two production environments diverge.
# That window cannot be eliminated; separate jobs at least make FCA
# independently re-runnable without re-pushing to PMSC.

on:
  push:
    branches:
      - main
      - sandbox

permissions:
  contents: read

env:
  # Pinned deliberately IN THE WORKFLOW, not as a secret or variable: pinning a
  # dependency version is a supply-chain control whose value comes from being
  # visible in a reviewed diff. Changing it must require a pull request.
  CLASP_VERSION: "3.4.1"

jobs:
  # ---------------------------------------------------------------- Sandbox
  deploy-sandbox:
    name: Deploy to Sandbox
    if: github.ref == 'refs/heads/sandbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: sandbox
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Install clasp (pinned)
        run: npm install -g "@google/clasp@${CLASP_VERSION}"

      - name: Authenticate clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -eu
          if [ -z "${CLASPRC_JSON}" ]; then
            echo "::error::CLASPRC_JSON is not set"; exit 1
          fi
          umask 077
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"

      - name: Target Sandbox script
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -eu
          if [ -z "${SCRIPT_ID}" ]; then
            echo "::error::SCRIPT_ID is not set for environment 'sandbox'"; exit 1
          fi
          jq --arg id "${SCRIPT_ID}" '.scriptId = $id' .clasp.json > .clasp.json.tmp
          mv .clasp.json.tmp .clasp.json

      - name: Push and deploy
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -eu
          if [ -z "${DEPLOYMENT_ID}" ]; then
            echo "::error::DEPLOYMENT_ID is not set for environment 'sandbox'"; exit 1
          fi
          clasp push --force
          clasp deploy -i "${DEPLOYMENT_ID}" \
            -d "GitHub Actions ${GITHUB_REF_NAME}@${GITHUB_SHA}"

      - name: Remove clasp credentials
        if: always()
        run: rm -f "${HOME}/.clasprc.json"

  # -------------------------------------------------------- PMSC Production
  deploy-pmsc-production:
    name: Deploy to PMSC Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pmsc-production   # required reviewers gate this job
    concurrency:
      group: deploy-pmsc-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Install clasp (pinned)
        run: npm install -g "@google/clasp@${CLASP_VERSION}"

      - name: Authenticate clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -eu
          if [ -z "${CLASPRC_JSON}" ]; then
            echo "::error::CLASPRC_JSON is not set"; exit 1
          fi
          umask 077
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"

      - name: Target PMSC Production script
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -eu
          if [ -z "${SCRIPT_ID}" ]; then
            echo "::error::SCRIPT_ID is not set for environment 'pmsc-production'"; exit 1
          fi
          jq --arg id "${SCRIPT_ID}" '.scriptId = $id' .clasp.json > .clasp.json.tmp
          mv .clasp.json.tmp .clasp.json

      - name: Push and deploy
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -eu
          if [ -z "${DEPLOYMENT_ID}" ]; then
            echo "::error::DEPLOYMENT_ID is not set for environment 'pmsc-production'"; exit 1
          fi
          clasp push --force
          clasp deploy -i "${DEPLOYMENT_ID}" \
            -d "GitHub Actions ${GITHUB_REF_NAME}@${GITHUB_SHA}"

      - name: Remove clasp credentials
        if: always()
        run: rm -f "${HOME}/.clasprc.json"

  # --------------------------------------------------------- FCA Production
  # needs: deploy-pmsc-production makes this FAIL CLOSED. If PMSC fails, FCA
  # never runs and both environments stay on the previous version.
  deploy-fca-production:
    name: Deploy to FCA Production
    needs: deploy-pmsc-production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: fca-production    # required reviewers gate this job
    concurrency:
      group: deploy-fca-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Install clasp (pinned)
        run: npm install -g "@google/clasp@${CLASP_VERSION}"

      - name: Authenticate clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -eu
          if [ -z "${CLASPRC_JSON}" ]; then
            echo "::error::CLASPRC_JSON is not set"; exit 1
          fi
          umask 077
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"

      - name: Target FCA Production script
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -eu
          if [ -z "${SCRIPT_ID}" ]; then
            echo "::error::SCRIPT_ID is not set for environment 'fca-production'"; exit 1
          fi
          jq --arg id "${SCRIPT_ID}" '.scriptId = $id' .clasp.json > .clasp.json.tmp
          mv .clasp.json.tmp .clasp.json

      - name: Push and deploy
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -eu
          if [ -z "${DEPLOYMENT_ID}" ]; then
            echo "::error::DEPLOYMENT_ID is not set for environment 'fca-production'"; exit 1
          fi
          clasp push --force
          clasp deploy -i "${DEPLOYMENT_ID}" \
            -d "GitHub Actions ${GITHUB_REF_NAME}@${GITHUB_SHA}"

      - name: Remove clasp credentials
        if: always()
        run: rm -f "${HOME}/.clasprc.json"
